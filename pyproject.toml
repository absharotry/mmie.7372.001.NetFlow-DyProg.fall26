[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apsp"
version = "0.1.0"
description = "All-pairs shortest paths benchmark: n x Dijkstra vs Floyd-Warshall"
requires-python = ">=3.11"
# Runtime dependencies are managed in requirements.txt / requirements-lock.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
