[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxflow"
version = "0.1.0"
description = "Maximum flow computational study: shortest augmenting path vs preflow-push"
requires-python = ">=3.11"
# Runtime dependencies are managed in requirements.txt / requirements-lock.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
